name: Build ExpressLRS
on: [push, pull_request]
jobs:
  build-and-validate-artifacts:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          cd src/html
          npm ci

      - name: Build Web UI for all platforms
        run: |
          cd src/html
          cp -r headers out
          npm run build:all

      - name: Validate artifacts
        id: validate
        run: |
          cd src/html
          if diff -qr out headers >/dev/null 2>&1; then
            echo "::notice::Artifact check passed."
            exit 0
          else
            exit_code=$?
            if [ "$exit_code" -eq 1 ]; then
              echo "::error title=Web UI Artifacts Error::Web UI artifacts have not been built and committed. Please build and commit them as part of this PR."
              exit 1
            else
              echo "::warning::An unexpected error ($exit_code) occurred during file comparison."
              exit 2
            fi
          fi

  test:
    runs-on: ubuntu-latest
    steps:

    - name: Inject slug/short variables
      uses: rlespinasse/github-slug-action@v5

    - name: Checkout
      uses: actions/checkout@v6

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.11'

    - name: Cache pip
      uses: actions/cache@v5
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ matrix.target }}

    - name: Install PlatformIO
      run: |
        python -m pip install --upgrade pip
        pip install platformio
        pip install wheel

    - name: Cache PlatformIO
      uses: actions/cache@v5
      with:
        path: ~/.platformio
        key: ${{ runner.os }}-platformio

    - name: Run PlatformIO Tests
      run: |
        cd src
        platformio pkg install --platform native
        platformio pkg update
        PLATFORMIO_BUILD_FLAGS="-DRegulatory_Domain_ISM_2400" pio test -e native

    - name: Check MAVLink parameter docs
      run: python src/python/gen_param_metadata.py --check

  targets:
    needs:
      - build-and-validate-artifacts
      - test
    runs-on: ubuntu-latest
    outputs:
      targets: ${{ steps.set-targets.outputs.targets }}
    steps:
    - name: Checkout
      uses: actions/checkout@v6
    - id: set-targets
      run: echo "targets=[$( (grep '\[env:.*UART\]' src/targets/*.ini ; grep -r '\[env:.*_via_DFU\]' src/targets/) | sed 's/.*://' | sed s/.$// | egrep "(_via_DFU|UART)" | grep -v DEPRECATED | tr '\n' ','  | sed 's/,$/"\n/' | sed 's/,/","/'g | sed 's/^/"/')]" >> $GITHUB_OUTPUT

  build:
    needs: targets
    strategy:
      fail-fast: false
      matrix:
        target: ${{fromJSON(needs.targets.outputs.targets)}}
    runs-on: ubuntu-latest
    steps:

    - name: Inject slug/short variables
      uses: rlespinasse/github-slug-action@v5

    - name: Checkout
      uses: actions/checkout@v6

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.11'

    - name: Cache pip
      uses: actions/cache@v5
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ matrix.target }}

    - name: Install PlatformIO
      run: |
        python -m pip install --upgrade pip
        pip install platformio
        pip install wheel

    - name: Cache PlatformIO
      uses: actions/cache@v5
      with:
        path: ~/.platformio
        key: ${{ runner.os }}-platformio

    - name: Install Node
      uses: actions/setup-node@v6
      with:
        node-version: 'latest'

    - name: Cache node-modules
      uses: actions/cache@v5
      with:
        path: src/html/node-modules
        key: ${{ runner.os }}-node-modules

    - name: Run PlatformIO
      run: |
        mkdir -p ~/artifacts/firmware
        cd src
        platformio pkg install --platform native
        platformio pkg update
        case ${{matrix.target}} in
          *2400* | FM30*)
            # release builds
            PLATFORMIO_BUILD_FLAGS="-DRegulatory_Domain_EU_CE_2400" pio run -e ${{ matrix.target }}
            OUTDIR=~/artifacts/firmware/LBT/`echo ${{ matrix.target }} | sed s/_via.*//`
            mkdir -p $OUTDIR
            mv .pio/build/${{ matrix.target }}/*.{elrs,bin} $OUTDIR >& /dev/null || :

            PLATFORMIO_BUILD_FLAGS="-DRegulatory_Domain_ISM_2400" pio run -e ${{ matrix.target }}
            OUTDIR=~/artifacts/firmware/FCC/`echo ${{ matrix.target }} | sed s/_via.*//`
            mkdir -p $OUTDIR
            mv .pio/build/${{ matrix.target }}/*.{elrs,bin} $OUTDIR >& /dev/null || :
            ;;
          *LR1121* | *LR2021*)
            # release builds
            PLATFORMIO_BUILD_FLAGS="-DRegulatory_Domain_EU_CE_2400 -DRegulatory_Domain_FCC_915" pio run -e ${{ matrix.target }}
            OUTDIR=~/artifacts/firmware/LBT/`echo ${{ matrix.target }} | sed s/_via.*//`
            mkdir -p $OUTDIR
            mv .pio/build/${{ matrix.target }}/*.{elrs,bin} $OUTDIR >& /dev/null || :

            PLATFORMIO_BUILD_FLAGS="-DRegulatory_Domain_FCC_915" pio run -e ${{ matrix.target }}
            OUTDIR=~/artifacts/firmware/FCC/`echo ${{ matrix.target }} | sed s/_via.*//`
            mkdir -p $OUTDIR
            mv .pio/build/${{ matrix.target }}/*.{elrs,bin} $OUTDIR >& /dev/null || :
            ;;
          *)
            # release build
            PLATFORMIO_BUILD_FLAGS="-DRegulatory_Domain_FCC_915" pio run -e ${{ matrix.target }}
            OUTDIR=~/artifacts/firmware/FCC/`echo ${{ matrix.target }} | sed s/_via.*//`
            mkdir -p $OUTDIR
            mv .pio/build/${{ matrix.target }}/*.{elrs,bin} $OUTDIR >& /dev/null || :
            ;;
        esac

    - name: Store Artifacts
      uses: actions/upload-artifact@v7
      with:
        name: temp-${{ matrix.target }}
        path: ~/artifacts/**/*
        retention-days: 1
      continue-on-error: true

  firmware:
    needs: [build, test]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Checkout targets repo
        uses: actions/checkout@v6
        with:
          repository: Titan-Dynamics/targets
          path: src/hardware

      - name: Get firmware artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Copy hardware files to firmware folder
        run: |
          cp -r src/hardware dist/firmware
          jq 'del(.generic)' src/hardware/targets.json > dist/firmware/hardware/targets.json

      - name: Copy Lua to to firmware folder
        run: |
          mkdir -p dist/firmware/lua
          cp -r src/lua/elrs.lua dist/firmware/lua

      - name: Copy bootloader files to firmware folder
        run: cd src ; find bootloader -name \*.bin -o -name \*.frk | grep -v src/ | cpio -pdm ../dist/firmware

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Add MAVLink parameter metadata to firmware folder
        run: |
          mkdir -p dist/firmware/mavlink
          python src/python/gen_param_metadata.py --xml dist/firmware/mavlink/TitanLRS.apm.pdef.xml --markdown dist/firmware/mavlink/MAVLinkParams.md

      - name: Build flasher "binary" with shiv
        run: |
          cd src/python
          pip install shiv==1.0.6
          shiv -c flash -o ../../dist/firmware/flasher.pyz pyserial .

      - name: Update firmware artifact
        uses: actions/upload-artifact@v7
        with:
          name: firmware
          path: dist/**/*

  # The web flasher reads firmware from the titanlrs R2 bucket at runtime, so new builds need no
  # flasher redeploy. This job only runs once every build and test of a master push has passed, so
  # it publishes the latest green master build ("Master (<commit>)" in the flasher). See
  # .github/scripts/r2-publish.sh for the bucket layout.
  publish-master:
    needs: firmware
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    # One publish at a time. A queued older publish is superseded by a newer one.
    concurrency:
      group: publish-master-r2
      cancel-in-progress: false
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download firmware artifact
        uses: actions/download-artifact@v8
        with:
          name: firmware
          path: dist

      # Newer AWS CLI releases send checksum headers R2 rejects.
      - name: Install downgraded AWS CLI
        uses: unfor19/install-aws-cli-action@v1
        with:
          version: "2.22.35"

      - name: Publish master build to R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_ENDPOINT_URL: ${{ secrets.AWS_ENDPOINT_URL }}
          AWS_REGION: "auto"
        run: .github/scripts/r2-publish.sh master dist/firmware

  release:
    needs: firmware
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Get version from tag
        id: version
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "Building TitanLRS version $VERSION"

      - name: Download firmware artifact
        uses: actions/download-artifact@v8
        with:
          name: firmware
          path: dist

      - name: Create release bundle
        run: |
          cd dist
          mv firmware firmware-${{ steps.version.outputs.VERSION }}
          zip -r -9 ../firmware-${{ steps.version.outputs.VERSION }}.zip ./firmware-${{ steps.version.outputs.VERSION }}
          cd ..
          sha256sum firmware-${{ steps.version.outputs.VERSION }}.zip > firmware-${{ steps.version.outputs.VERSION }}.zip.sha256

      - name: Attach firmware to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            firmware-${{ steps.version.outputs.VERSION }}.zip
            firmware-${{ steps.version.outputs.VERSION }}.zip.sha256
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Publish the release to R2 for the web flasher, once the GitHub release exists. Existing releases
  # are uploaded with the "Publish releases to R2" workflow (r2-releases.yml).
  publish-release:
    needs: release
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Download firmware artifact
        uses: actions/download-artifact@v8
        with:
          name: firmware
          path: dist

      # Newer AWS CLI releases send checksum headers R2 rejects.
      - name: Install downgraded AWS CLI
        uses: unfor19/install-aws-cli-action@v1
        with:
          version: "2.22.35"

      - name: Publish release to R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_ENDPOINT_URL: ${{ secrets.AWS_ENDPOINT_URL }}
          AWS_REGION: "auto"
        run: .github/scripts/r2-publish.sh release "$GITHUB_REF_NAME" dist/firmware

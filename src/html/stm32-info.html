<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TitanLRS</title>
<style>
:root{
  --bg-0:#08090A;--bg-1:#0E0F11;--bg-2:#16181B;--bg-3:#1D1F23;--bg-4:#25282D;
  --line:rgba(255,255,255,.06);--line-2:rgba(255,255,255,.10);--line-3:rgba(255,255,255,.16);
  --fg:#E6E7EA;--fg-mute:#9A9DA3;--fg-dim:#6B6E74;--fg-faint:#4A4D52;
  --brand:#F26B1F;--brand-hi:#FF8133;--brand-lo:#C9551A;
  --brand-soft:rgba(242,107,31,.14);--brand-line:rgba(242,107,31,.36);
  --ok:#4FC78F;--warn:#E5A53B;--bad:#E8624C;
  --font:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --mono:ui-monospace,'SF Mono',Menlo,monospace;
  --r-md:6px;--r-lg:8px;--dur:120ms;--ease:cubic-bezier(.2,.6,.2,1);
}
*,*::before,*::after{box-sizing:border-box;}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg-0);}
body{font-family:var(--font);font-size:13px;line-height:18px;color:var(--fg);-webkit-font-smoothing:antialiased;}

/* App shell */
.app{display:grid;grid-template-columns:224px 1fr;height:100vh;}

/* Sidebar */
.side{border-right:1px solid var(--line);background:var(--bg-0);display:flex;flex-direction:column;overflow:hidden;}
.side-head{height:48px;padding:0 12px;display:flex;align-items:center;border-bottom:1px solid var(--line);}
.logo{display:flex;align-items:center;gap:8px;font-weight:600;font-size:13px;letter-spacing:-.01em;color:var(--fg);text-decoration:none;}
.logo-mark{width:16px;height:16px;display:inline-block;background:var(--fg);
  -webkit-mask:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><path d='M12 2L2 21L22 21Z M12 8L7 18L17 18Z' fill='black' fill-rule='evenodd'/></svg>") no-repeat center/contain;
          mask:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><path d='M12 2L2 21L22 21Z M12 8L7 18L17 18Z' fill='black' fill-rule='evenodd'/></svg>") no-repeat center/contain;}
.side-scroll{flex:1;overflow-y:auto;padding:8px 0 16px;}
.side-foot{padding:10px 12px;border-top:1px solid var(--line);display:flex;align-items:center;gap:8px;font-size:12px;color:var(--fg-mute);}
.side-foot .ip{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--fg-dim);}

/* Nav */
.nav-section{padding:12px 12px 4px;font-size:11px;font-weight:500;letter-spacing:.04em;text-transform:uppercase;color:var(--fg-dim);}
.nav-item{display:flex;align-items:center;gap:10px;padding:0 10px;height:28px;margin:1px 6px;border-radius:var(--r-md);color:var(--fg-mute);font-size:13px;cursor:pointer;text-decoration:none;transition:background var(--dur) var(--ease),color var(--dur) var(--ease);position:relative;}
.nav-item:hover{background:var(--bg-2);color:var(--fg);}
.nav-item.is-active{background:var(--bg-3);color:var(--fg);}
.nav-item.is-active::before{content:'';position:absolute;left:-6px;top:6px;bottom:6px;width:2px;background:var(--brand);border-radius:0 2px 2px 0;}
.nav-item svg{width:16px;height:16px;flex-shrink:0;stroke:var(--fg-dim);fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;}
.nav-item.is-active svg{stroke:var(--brand);}

/* Live dot */
.dot{width:6px;height:6px;border-radius:50%;flex-shrink:0;position:relative;}
.dot-ok{background:var(--ok);box-shadow:0 0 8px var(--ok);}
.dot-live::after{content:'';position:absolute;inset:-4px;border-radius:50%;border:1px solid var(--ok);animation:pulse 1.6s var(--ease) infinite;opacity:0;}
@keyframes pulse{0%{transform:scale(.6);opacity:.8;}100%{transform:scale(1.4);opacity:0;}}

/* Main */
.main{display:grid;grid-template-rows:48px 1fr;overflow:hidden;background:var(--bg-0);}
.topbar{display:flex;align-items:center;padding:0 16px;border-bottom:1px solid var(--line);}
.crumbs{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--fg-mute);}
.crumbs .sep{color:var(--fg-faint);}
.crumbs .here{color:var(--fg);}

/* Pane */
.pane{overflow-y:auto;padding:28px 32px 64px;}
.pane-inner{max-width:920px;}

/* Page header */
.page-head{display:flex;align-items:flex-end;margin-bottom:20px;}
.eyebrow{display:flex;align-items:center;gap:8px;font-family:var(--mono);font-size:11px;color:var(--fg-dim);margin-bottom:8px;}
.eyebrow .sep{color:var(--fg-faint);}
h1{font-size:28px;line-height:34px;font-weight:600;letter-spacing:-.02em;margin:0;color:var(--fg);}

/* Info card */
.info-card{background:var(--bg-1);border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden;}
.info-card+.info-card{margin-top:16px;}
.info-row{display:grid;grid-template-columns:200px 1fr;align-items:stretch;min-height:36px;border-bottom:1px solid var(--line);}
.info-row:last-child{border-bottom:none;}
.info-row .k{padding:8px 16px;font-size:12px;color:var(--fg-mute);font-weight:500;background:rgba(255,255,255,.015);border-right:1px solid var(--line);display:flex;align-items:center;}
.info-row .v{padding:8px 16px;font-family:var(--mono);font-size:13px;color:var(--fg);word-break:break-all;display:flex;align-items:center;}
.info-row .v.txt{font-family:var(--font);}
.info-card-section{padding:6px 16px;font-size:11px;font-weight:500;letter-spacing:.04em;text-transform:uppercase;color:var(--fg-dim);background:rgba(255,255,255,.02);border-bottom:1px solid var(--line);}

#err{color:var(--bad);margin-top:12px;font-size:13px;}

/* Mobile */
@media(max-width:640px){
  html,body{overflow:auto;}
  .app{grid-template-columns:1fr;grid-template-rows:auto 1fr;height:auto;min-height:100vh;}
  .side{flex-direction:row;border-right:none;border-bottom:1px solid var(--line);height:auto;}
  .side-head{border-bottom:none;height:44px;flex-shrink:0;}
  .side-scroll{flex-direction:row;display:flex;align-items:center;padding:0 8px;overflow-x:auto;overflow-y:hidden;}
  .nav-section{display:none;}
  .nav-item{height:44px;white-space:nowrap;margin:0 2px;}
  .nav-item.is-active::before{top:auto;bottom:0;left:6px;right:6px;width:auto;height:2px;border-radius:2px 2px 0 0;}
  .side-foot{display:none;}
  .main{grid-template-rows:44px 1fr;}
  .pane{padding:16px 12px 32px;}
  h1{font-size:20px;line-height:26px;}
  .info-row{grid-template-columns:140px 1fr;}
}
</style>
</head>
<body>
<div class="app">

  <!-- Sidebar -->
  <aside class="side">
    <div class="side-head">
      <a class="logo" href="/">
        <span class="logo-mark"></span>
        TitanLRS
      </a>
    </div>
    <div class="side-scroll">
      <div class="nav-section">Workspace</div>
      <a class="nav-item is-active" href="/">
        <svg viewBox="0 0 16 16"><path d="m2 7 6-5 6 5v6.5a.5.5 0 0 1-.5.5H10v-4H6v4H2.5a.5.5 0 0 1-.5-.5z"/></svg>
        Overview
      </a>
      <a class="nav-item" href="/binding">
        <svg viewBox="0 0 16 16"><path d="M5.5 8a2.5 2.5 0 1 0 5 0 2.5 2.5 0 0 0-5 0zM2 8a6 6 0 1 1 12 0A6 6 0 0 1 2 8z"/><path d="M8 5.5V2M8 14v-3.5M5.5 8H2M14 8h-3.5"/></svg>
        Binding
      </a>
      <a class="nav-item" href="/update">
        <svg viewBox="0 0 16 16"><path d="M9 2 3.5 9.5H7L7 14l5.5-7.5H9z"/></svg>
        Flash Firmware
      </a>
    </div>
    <div class="side-foot">
      <span class="dot dot-ok dot-live"></span>
      <span>Connected</span>
      <span class="ip">192.168.4.1</span>
    </div>
  </aside>

  <!-- Main -->
  <main class="main">
    <div class="topbar">
      <div class="crumbs">
        <span>Device</span>
        <span class="sep">/</span>
        <span class="here">Overview</span>
      </div>
    </div>
    <div class="pane">
      <div class="pane-inner">

        <div class="page-head">
          <div class="id-block">
            <div class="eyebrow" id="eyebrow">&nbsp;</div>
            <h1 id="title">Loading&hellip;</h1>
          </div>
        </div>

        <div class="info-card" id="info-card">
          <div class="info-row"><span class="k">Loading</span><span class="v">&hellip;</span></div>
        </div>

        <div class="info-card" id="custom-card" style="display:none"></div>

        <div id="err"></div>

      </div>
    </div>
  </main>

</div>
<script>
function row(k,v,txt){
  return '<div class="info-row"><span class="k">'+k+'</span><span class="v'+(txt?' txt':'')+'">'+v+'</span></div>';
}
fetch('/config').then(function(r){return r.json();}).then(function(d){
  var s=d.settings||{};
  var o=d.options||{};
  var c=d.config||{};

  // Eyebrow: UID from git hash
  var hash=s['git-commit']||'';
  document.getElementById('eyebrow').innerHTML=hash?('<span>UID '+hash+'</span>'):'&nbsp;';

  // Title: product name
  document.getElementById('title').textContent=s.product_name||'TitanLRS Device';

  // Build info rows
  var band='';
  if(s.reg_domain_low)band=s.reg_domain_low;
  if(s.reg_domain_high)band=band?(band+' / '+s.reg_domain_high):s.reg_domain_high;
  var uid=Array.isArray(c.uid)?c.uid.join(','):'Not bound';

  var html='';
  if(s.product_name)html+=row('Product',s.product_name,true);
  if(s.lua_name)html+=row('Lua Name',s.lua_name,true);
  if(s.version)html+=row('Version',s.version);
  if(hash)html+=row('Git Hash',hash);
  if(s['module-type'])html+=row('Device Type',s['module-type'],true);
  if(s.target)html+=row('Firmware',s.target);
  if(s['radio-type'])html+=row('Radio',s['radio-type']);
  if(band)html+=row('Domain',band);
  html+=row('Binding UID',uid);

  document.getElementById('info-card').innerHTML=html;

  // Custom settings
  var custom=[];
  if(o['wifi-on-interval']!=null&&o['wifi-on-interval']>=0)custom.push(row('WiFi Auto On',o['wifi-on-interval']+'s'));
  if(o['is-airport'])custom.push(row('Airport Mode','Yes',true));
  if(o['rcvr-uart-baud']&&o['rcvr-uart-baud']!==420000)custom.push(row('UART Baud',''+o['rcvr-uart-baud']));
  if(o['lock-on-first-connection']===false)custom.push(row('Lock on First Connect','No',true));
  if(custom.length){
    var cc=document.getElementById('custom-card');
    cc.innerHTML='<div class="info-card-section">Custom Settings</div>'+custom.join('');
    cc.style.display='';
  }
}).catch(function(){
  document.getElementById('title').textContent='TitanLRS Device';
  document.getElementById('info-card').innerHTML='<div class="info-row"><span class="k">Error</span><span class="v txt">Failed to load configuration</span></div>';
  document.getElementById('err').textContent='Could not reach /config — check device connection.';
});
</script>
</body>
</html>

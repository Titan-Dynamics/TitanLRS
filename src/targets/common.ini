
# ------------------------- COMMON ENV DEFINITIONS -----------------
[env]
framework = arduino
extra_scripts =
	pre:python/build_flags.py
	pre:python/lib_exclusions.py
	python/build_env_setup.py
monitor_dtr = 0
monitor_rts = 0

[common_env_data]
build_src_filter = +<*> -<.git/> -<svn/> -<example/> -<examples/> -<test/> -<tests/> -<*.py> -<*test*.*>
build_flags = -Wall -Iinclude -DMAVLINK_NO_SIGN_PACKET -DMAVLINK_NO_SIGNATURE_CHECK
build_flags_tx = -DTARGET_TX=1 ${common_env_data.build_flags}
build_flags_rx = -DTARGET_RX=1 ${common_env_data.build_flags}
mavlink_lib_dep = https://github.com/mavlink/c_library_v2.git#cd78b9bf618215bf911332716659364d51401d94

[radio_SX127X]
build_flags = -DRADIO_SX127X=1
lib_ignore =
	LR2021Driver
	LR1121Driver
	SX1280Driver

[radio_SX128X]
build_flags = -DRADIO_SX128X=1
lib_ignore =
	SX127xDriver
	LR1121Driver
	LR2021Driver

[radio_LR1121]
build_flags = -DRADIO_LR1121=1
lib_ignore =
	SX127xDriver
	SX1280Driver
	LR2021Driver

[radio_LR2021]
build_flags = -DRADIO_LR2021=1
lib_ignore =
	SX127xDriver
	SX1280Driver
	LR1121Driver

# ------------------------- COMMON ESP32 DEFINITIONS -----------------

[env_common_esp32]
platform = espressif32@6.12.0
board = esp32dev
board_build.partitions = min_spiffs.csv
upload_speed = 460800
upload_resetmethod = nodemcu
board_build.f_cpu = 240000000L
monitor_filters = esp32_exception_decoder
extra_scripts =
	${env.extra_scripts}
	pre:python/copy_html.py
build_flags =
	-D PLATFORM_ESP32=1
	-D CONFIG_TCPIP_LWIP=1
	-D BEARSSL_SSL_BASIC
	-D CONFIG_DISABLE_HAL_LOCKS=1
	-I ${PROJECTSRC_DIR}/hal
lib_deps =
	esp32async/AsyncTCP @ 3.4.8
	esp32async/ESPAsyncWebServer @ 3.8.1
	bblanchon/ArduinoJson @ 7.4.2
	${common_env_data.mavlink_lib_dep}

# ------------------------- COMMON ESP82xx DEFINITIONS -----------------
[env_common_esp82xx]
platform = espressif8266@4.2.1
board = esp8285
board_build.f_cpu = 160000000L  ; 80MHz in board def
board_build.f_flash = 80000000L ; 40MHz in board def
board_build.ldscript = ./elrs.flash.1m.ld
build_flags =
	-DNDEBUG
	-D PLATFORM_ESP8266=1
	-D VTABLES_IN_FLASH=1
	-D PIO_FRAMEWORK_ARDUINO_MMU_CACHE16_IRAM48
	-D PIO_FRAMEWORK_ARDUINO_LWIP2_LOW_MEMORY_LOW_FLASH
	-Wl,--wrap=stopWaveform -Wl,--wrap=_stopPWM
	-I ${PROJECTSRC_DIR}/hal
extra_scripts =
	${env.extra_scripts}
	pre:python/copy_html.py
lib_deps =
	makuna/NeoPixelBus @ 2.8.4
	esp32async/ESPAsyncTCP @ 2.0.0
	esp32async/ESPAsyncWebServer @ 3.8.1
	bblanchon/ArduinoJson @ 7.4.2
	${common_env_data.mavlink_lib_dep}
upload_speed = 460800
monitor_filters = esp8266_exception_decoder
upload_resetmethod = nodemcu

# ------------------------- COMMON STM32 DEFINITIONS -----------------
[env_common_stm32]
platform = ststm32@19.5.0
extra_scripts =
	${env.extra_scripts}
	pre:python/stm32_usb_composite.py
build_flags =
	-D PLATFORM_STM32=1
	-Wl,-Map,"'${BUILD_DIR}/firmware.map'"
	-O2
	-D __FILE__='""'
	-Wno-builtin-macro-redefined
	-D USBCON
	-D USBD_USE_CDC
    ; USB VID/PID live in the per-target headers under include/target/ — they are force-included
    ; with -include, so anything set here would be silently overridden. These two strings are not
    ; defined there, so they belong here; they also replace the stm32duino default product name,
    ; which was the board name plus "CDC in FS Mode".
    -D USB_MANUFACTURER_STRING='"Titan Dynamics"'
    -D USB_PRODUCT_STRING='"TitanLRS"'
    ; Must come before the framework's own USBDevice/inc, which the ststm32 builder puts on the
    ; include path unconditionally: our replacement headers (usbd_conf.h, usbd_desc.h,
    ; usbd_ep_conf.h, USBSerial.h, cdc_queue.h) deliberately shadow the single-class originals.
    -I lib/USBComposite
    -D HAL_PCD_MODULE_ENABLED
    ; CDC receive queue, in 64-byte USB packets. The core default of 3 (192 bytes) leaves only
    ; ~128 usable, because CDC_ReceiveQueue_ReserveBlock() needs a whole free packet — so any
    ; request longer than two packets pauses reception, and the RX never resumes from that pause
    ; (Issues.md BUG #5). 32 packets = 2 KB rides out a host write burst (MAVLink param/mission
    ; uploads) without the pause ever being entered.
    -D CDC_RECEIVE_QUEUE_BUFFER_PACKET_NUMBER=32
    ; lwIP's configuration. It has to be on the global include path: the LwIP library itself
    ; includes "lwipopts.h" while it compiles.
    -I lib/USBNet/lwip-port
build_src_filter = ${common_env_data.build_src_filter} -<ESP32*.*> -<ESP8266*.*> -<WS281B*.*>
; USBDevice is the framework's single-class USB stack; lib/USBComposite replaces it wholesale
; with a CDC-ACM + CDC-NCM composite device, so the two must never both build.
lib_ignore = VTXSPI, VTX, WIFI, TCPSOCKET, PWM, ServoOutput, USBDevice
lib_deps =
	USBComposite
	bblanchon/ArduinoJson @ 7.4.2
	; lwIP for the USB network interface (lib/USBNet), configured by lib/USBNet/lwip-port/lwipopts.h
	stm32duino/STM32duino LwIP @ 2.2.1
	${common_env_data.mavlink_lib_dep}
oled_lib_deps =
	${env_common_stm32.lib_deps}
	olikraus/U8g2 @ 2.34.4
monitor_speed = 420000

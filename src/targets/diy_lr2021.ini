
# ********************************
# DIY LR2021 Receiver target
# ********************************

# Common LR2021 STM32 build flags
[lr2021_stm32_common]
extends = env_common_stm32, radio_LR2021
board = weact_mini_h743vitx
board_build.ldscript = variants/H743_ldscript_no_bl.ld
build_src_filter = ${env_common_stm32.build_src_filter} -<tx_*.cpp>
lib_ignore =
	VTXSPI
	VTX
	WIFI
	TCPSOCKET
	PWM
	ServoOutput
	SX127xDriver
	SX1280Driver
	LR1121Driver

[env:DIY_LR2021_RX_STM32H743_via_STLINK]
extends = lr2021_stm32_common
build_flags =
	${env_common_stm32.build_flags}
	${radio_LR2021.build_flags}
	${common_env_data.build_flags_rx}
	-include target/DIY_LR2021_RX_STM32H743.h
	-DTARGET_NAME=TD_LR2021_RX
	-O2

[env:DIY_LR2021_RX_STM32H743_via_DFU]
extends = env:DIY_LR2021_RX_STM32H743_via_STLINK
upload_protocol = dfu

# ********************************
# DIY LR2021 Transmitter target
# ********************************

[lr2021_stm32_tx_common]
extends = env_common_stm32, radio_LR2021
board = weact_mini_h743vitx
board_build.ldscript = variants/H743_ldscript_no_bl.ld
build_src_filter = ${env_common_stm32.build_src_filter} -<rx_*.cpp> -<rx-*/>
lib_ignore =
	VTXSPI
	VTX
	WIFI
	TCPSOCKET
	PWM
	ServoOutput
	SX127xDriver
	SX1280Driver
	LR1121Driver
	Backpack
	BLE
	GSENSOR
	SCREEN
	THERMAL
	POWER_DETECT
	MSPVTX

[env:DIY_LR2021_TX_STM32H743_via_STLINK]
extends = lr2021_stm32_tx_common
build_flags =
	${env_common_stm32.build_flags}
	${radio_LR2021.build_flags}
	${common_env_data.build_flags_tx}
	-include target/DIY_LR2021_TX_STM32H743.h
	-DTARGET_NAME=TD_LR2021_TX
	-O2

[env:DIY_LR2021_TX_STM32H743_via_DFU]
extends = env:DIY_LR2021_TX_STM32H743_via_STLINK
upload_protocol = dfu

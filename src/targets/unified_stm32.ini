
# *****************************
# Unified STM32 LR2021 targets
# *****************************

[lr2021_stm32_common]
extends = env_common_stm32, radio_LR2021
build_src_filter = ${env_common_stm32.build_src_filter} -<tx_*.cpp>
lib_ignore =
	VTXSPI
	VTX
	WIFI
	TCPSOCKET
	PWM
	ServoOutput
	SX127xDriver
	SX1280Driver
	LR1121Driver

[lr2021_stm32_tx_common]
extends = env_common_stm32, radio_LR2021
build_src_filter = ${env_common_stm32.build_src_filter} -<rx_*.cpp> -<rx-*/>
lib_ignore =
	VTXSPI
	VTX
	WIFI
	TCPSOCKET
	PWM
	ServoOutput
	SX127xDriver
	SX1280Driver
	LR1121Driver
	Backpack
	BLE
	GSENSOR
	SCREEN
	POWER_DETECT
	MSPVTX

[stm32h743_board]
board = weact_mini_h743vitx
board_build.ldscript = variants/H743_ldscript_no_bl.ld

[env:Unified_STM32H743_LR2021_TX_via_DFU]
extends = lr2021_stm32_tx_common, stm32h743_board
upload_protocol = dfu
build_flags =
	${env_common_stm32.build_flags}
	${radio_LR2021.build_flags}
	${common_env_data.build_flags_tx}
	-include target/Unified_STM32_TX.h
	-DTARGET_NAME=Unified_STM32H743_LR2021_TX
	-O2

[env:Unified_STM32H743_LR2021_RX_via_DFU]
extends = lr2021_stm32_common, stm32h743_board
upload_protocol = dfu
build_flags =
	${env_common_stm32.build_flags}
	${radio_LR2021.build_flags}
	${common_env_data.build_flags_rx}
	-include target/Unified_STM32_RX.h
	-DTARGET_NAME=Unified_STM32H743_LR2021_RX
	-O2

[env:Unified_STM32F411_LR2021_RX_via_DFU]
extends = lr2021_stm32_common
board = genericSTM32F411CE
upload_protocol = dfu
build_flags =
	${env_common_stm32.build_flags}
	${radio_LR2021.build_flags}
	${common_env_data.build_flags_rx}
	-include target/Unified_STM32_RX.h
	-DTARGET_NAME=Unified_STM32F411_LR2021_RX
	-O2

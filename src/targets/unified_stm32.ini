
# ********************************
# Unified STM32H743 LR2021 targets
# ********************************
# One TX and one RX build for every STM32H743 + LR2021 board (single radio or Gemini). The board
# is described by the hardware layout the web flasher patches into the firmware slot, as on the
# ESP unified targets; see include/target/Unified_STM32_{TX,RX}.h.

[env:Unified_STM32H743_LR2021_TX_via_STLINK]
extends = lr2021_stm32_tx_common
build_flags =
	${env_common_stm32.build_flags}
	${radio_LR2021.build_flags}
	${common_env_data.build_flags_tx}
	-include target/Unified_STM32_TX.h
	-DTARGET_NAME=Unified_STM32H743_LR2021_TX
	-O2

[env:Unified_STM32H743_LR2021_TX_via_DFU]
extends = env:Unified_STM32H743_LR2021_TX_via_STLINK
upload_protocol = dfu

[env:Unified_STM32H743_LR2021_RX_via_STLINK]
extends = lr2021_stm32_common
build_flags =
	${env_common_stm32.build_flags}
	${radio_LR2021.build_flags}
	${common_env_data.build_flags_rx}
	-include target/Unified_STM32_RX.h
	-DTARGET_NAME=Unified_STM32H743_LR2021_RX
	-O2

[env:Unified_STM32H743_LR2021_RX_via_DFU]
extends = env:Unified_STM32H743_LR2021_RX_via_STLINK
upload_protocol = dfu
